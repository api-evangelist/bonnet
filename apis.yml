aid: bonnet
name: Bonnet
description: 'Bonnet is a UK-based electric vehicle (EV) charging app that aggregates
  multiple charging networks into a single platform, letting drivers find, access, and
  pay for chargers across Europe through one membership. Headquartered in Bristol and
  acquired by OVO Energy, it gives consumers real-time charger status, route planning,
  membership plans with per-charge savings, and weekly charging-credit rewards, while
  offering charge point operator (CPO) and fleet solutions with white-label integration
  for businesses. Surfaced as a portfolio company of gv and lightspeed-venture-partners
  and added to the API Evangelist network. Bonnet publishes a consumer mobile app but
  no public developer API at this time.'
